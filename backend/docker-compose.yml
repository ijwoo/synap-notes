# 로컬 개발용 DB (PostgreSQL 16 + pgvector) 만 띄웁니다.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: synap
      POSTGRES_USER: synap
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
