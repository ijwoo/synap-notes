# Synap 로컬 실행용 예시 설정.
#   cp application.example.properties application.properties  (application.properties 는 커밋하지 않습니다)
# 값은 모두 자리표시자입니다. 환경 변수로 덮어쓸 수 있습니다.

spring.application.name=synap

# ---- DB (PostgreSQL + pgvector) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/synap}
spring.datasource.username=${DB_USER:synap}
spring.datasource.password=${DB_PASSWORD:change-me}

# 스키마는 Flyway 가 소유합니다 (pgvector 확장 / HNSW 인덱스)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---- 임베딩 ----
# dummy: 키 없이 해시 기반 결정적 벡터 / openai: OpenAI 임베딩 API
app.embedding.provider=${EMBEDDING_PROVIDER:dummy}
app.embedding.dimensions=1536
app.embedding.openai.api-key=${OPENAI_API_KEY:}
app.embedding.openai.model=text-embedding-3-small
app.embedding.openai.base-url=https://api.openai.com/v1

# ---- 자동 연결 ----
app.linking.top-k=8
# 유사도(1 - 코사인 거리)가 이 값 이상인 이웃만 자동 링크합니다. 임베딩 제공자에 맞게 조정합니다.
app.linking.threshold=${LINKING_THRESHOLD:0.15}

# ---- 데모 시드 (사용자가 없는 빈 DB 일 때만 적재) ----
app.seed.enabled=${SEED_ENABLED:true}

# ---- 인증 ----
app.jwt.secret=${JWT_SECRET:change-me-to-a-random-string-at-least-32-bytes}
app.jwt.ttl-hours=${JWT_TTL_HOURS:168}
# 구글 OAuth 웹 클라이언트 ID. 비우면 구글 로그인이 비활성화됩니다.
app.oauth.google.client-id=${GOOGLE_CLIENT_ID:}

server.port=${SERVER_PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always
logging.level.com.synap=INFO
